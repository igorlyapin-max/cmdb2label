services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cmdb2label-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/cmdb2label-dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
