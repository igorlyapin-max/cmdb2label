openapi: 3.0.3
info:
  title: cmdb2label API
  version: 00.00.00.12
  description: >
    Backend-owned UI, API этикеток, health, metrics и diagnostics для генерации
    этикеток CMDBuild. CMDBuild session cookies обрабатываются на серверной
    стороне; browser JavaScript не читает CMDBuild-Authorization.
servers:
  - url: http://127.0.0.1:8094
    description: Локальный backend
  - url: http://localhost:8088
    description: Локальный same-origin reverse proxy
tags:
  - name: ui
  - name: labels
  - name: health
  - name: diagnostics
  - name: metrics
security:
  - cmdbuildCookie: []
paths:
  /cmdbuild/labels/ui:
    get:
      tags: [ui]
      security: []
      summary: Отдать UI генератора этикеток
      responses:
        "200":
          description: HTML UI
          content:
            text/html:
              schema:
                type: string
  /cmdbuild/custom-api/labels/session:
    get:
      tags: [labels]
      summary: Прочитать текущую CMDBuild session
      responses:
        "200":
          description: Очищенная CMDBuild session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cmdbuild/custom-api/labels/csrf:
    get:
      tags: [labels]
      summary: Выдать CSRF token для текущей CMDBuild session
      responses:
        "200":
          description: CSRF token и имя обязательного header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cmdbuild/custom-api/labels/resolve:
    post:
      tags: [labels]
      summary: Преобразовать черновики устройств в строки печатных этикеток
      description: >
        Требует same-origin Origin или Referer, CMDBuild session cookie и
        X-CMDB2Label-CSRF. Backend обогащает недостающие поля через CMDBuild REST.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Все устройства обработаны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: Запрос принят, но одна или несколько строк не были полностью обработаны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "502":
          $ref: "#/components/responses/BadGateway"
  /cmdbuild/custom-api/labels/logging/status:
    get:
      tags: [diagnostics]
      summary: Прочитать безопасную конфигурацию логирования
      responses:
        "200":
          description: Безопасный logging status без секретов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggingStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cmdbuild/custom-api/labels/client-log:
    get:
      tags: [diagnostics]
      summary: Записать очищенное клиентское диагностическое событие
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: message
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Событие принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cmdbuild/custom-api/labels/health/live:
    get:
      tags: [health]
      security: []
      summary: Liveness probe с API prefix
      responses:
        "200":
          description: Процесс backend работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /cmdbuild/custom-api/labels/health/ready:
    get:
      tags: [health]
      security: []
      summary: Readiness probe с API prefix
      responses:
        "200":
          description: Backend готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend не готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
  /cmdbuild/custom-api/labels/about:
    get:
      tags: [health]
      security: []
      summary: Безопасная build identity под API prefix
      responses:
        "200":
          description: Безопасная identity сервиса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutResponse"
  /health/live:
    get:
      tags: [health]
      security: []
      summary: Проверка liveness
      responses:
        "200":
          description: Процесс backend работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /health/ready:
    get:
      tags: [health]
      security: []
      summary: Проверка readiness
      responses:
        "200":
          description: Backend готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend не готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
  /about:
    get:
      tags: [health]
      security: []
      summary: Безопасная build identity
      responses:
        "200":
          description: Безопасная identity сервиса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutResponse"
  /metrics:
    get:
      tags: [metrics]
      security: []
      summary: Метрики Prometheus
      description: Должен публиковаться только для internal/protected monitoring.
      responses:
        "200":
          description: Текстовый формат Prometheus
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
components:
  securitySchemes:
    cmdbuildCookie:
      type: apiKey
      in: cookie
      name: CMDBuild-Authorization
  parameters:
    CsrfHeader:
      name: X-CMDB2Label-CSRF
      in: header
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Невалидное тело запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: CMDBuild session отсутствует или истекла
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Проверка same-origin, CSRF или прав не пройдена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Тело запроса или batch устройств слишком большой
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Content-Type должен быть application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: CMDBuild upstream временно недоступен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          example: false
        message:
          type: string
    SessionResponse:
      type: object
      required: [ok, session]
      properties:
        ok:
          type: boolean
        session:
          type: object
          additionalProperties: true
          description: Очищенный объект CMDBuild session.
    CsrfResponse:
      type: object
      required: [ok, token, header]
      properties:
        ok:
          type: boolean
        token:
          type: string
        header:
          type: string
          example: X-CMDB2Label-CSRF
    ResolveRequest:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DeviceDraft"
    DeviceDraft:
      type: object
      properties:
        inv:
          type: string
          description: Инвентарный номер.
        type:
          type: string
          description: Тип устройства, печатаемый на этикетке.
        model:
          type: string
          description: Модель устройства.
        sn:
          type: string
          description: Серийный номер.
        lookupKey:
          type: string
          description: Внутренний lookup key из одноколоночного CSV; напрямую не печатается.
      additionalProperties: true
    LabelDevice:
      type: object
      required: [inv, type, model, sn]
      properties:
        inv:
          type: string
        type:
          type: string
        model:
          type: string
        sn:
          type: string
    ResolveResponse:
      type: object
      required: [ok, devices, errors, meta]
      properties:
        ok:
          type: boolean
        devices:
          type: array
          items:
            $ref: "#/components/schemas/LabelDevice"
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          required: [inputCount, outputCount, cmdbuildRestCalls]
          properties:
            inputCount:
              type: integer
            outputCount:
              type: integer
            cmdbuildRestCalls:
              type: integer
    BuildIdentity:
      type: object
      required: [version, buildVersion, revision, sourceState, buildMode, runtimeArtifact]
      properties:
        version:
          type: string
        buildVersion:
          type: string
        revision:
          type: string
        sourceState:
          type: string
          enum: [verified, unverified-local]
        buildMode:
          type: string
          enum: [canonical, manual]
        runtimeArtifact:
          type: object
          additionalProperties: true
    LiveHealth:
      type: object
      required: [service, live, identity]
      properties:
        service:
          type: string
          example: cmdb2label
        live:
          type: boolean
        identity:
          $ref: "#/components/schemas/BuildIdentity"
    ReadyHealth:
      type: object
      required: [service, ready]
      properties:
        service:
          type: string
          example: cmdb2label
        ready:
          type: boolean
        status:
          type: string
        identity:
          $ref: "#/components/schemas/BuildIdentity"
    AboutResponse:
      type: object
      required: [service, identity]
      properties:
        service:
          type: string
          example: cmdb2label
        identity:
          $ref: "#/components/schemas/BuildIdentity"
    LoggingStatusResponse:
      type: object
      required: [ok, logging]
      properties:
        ok:
          type: boolean
        logging:
          type: object
          additionalProperties: true
