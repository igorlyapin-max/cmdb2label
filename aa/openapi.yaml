openapi: 3.0.3
info:
  title: cmdb2label API
  version: 00.00.00.14
  description: >
    Backend-owned UI, API этикеток, health, metrics и diagnostics для генерации
    этикеток CMDBuild. CMDBuild session cookies обрабатываются на серверной
    стороне; browser JavaScript не читает CMDBuild-Authorization.
servers:
  - url: http://127.0.0.1:8094
    description: Локальный backend
  - url: http://localhost:8088
    description: Локальный same-origin reverse proxy
tags:
  - name: ui
  - name: labels
  - name: health
  - name: diagnostics
  - name: metrics
security:
  - cmdbuildCookie: []
paths:
  /cmdbuild/labels/ui:
    get:
      tags: [ui]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: IF1
      summary: Отдать UI генератора этикеток
      description: >
        Публичный same-origin UI route. Не отдает business data, cookies или secrets;
        доступ ограничивается reverse proxy/ingress контуром CMDBuild.
      responses:
        "200":
          description: HTML UI
          content:
            text/html:
              schema:
                type: string
                maxLength: 1048576
                pattern: '^[\s\S]*$'
  /cmdbuild/custom-api/labels/session:
    get:
      tags: [labels]
      x-aa-flow-id: OAPI0
      summary: Прочитать текущую CMDBuild session
      responses:
        "200":
          description: Очищенная CMDBuild session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: CMDBuild session отсутствует или истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Проверка same-origin, CSRF или прав не пройдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cmdbuild/custom-api/labels/csrf:
    get:
      tags: [labels]
      x-aa-flow-id: OAPI0
      summary: Выдать CSRF token для текущей CMDBuild session
      responses:
        "200":
          description: CSRF token и имя обязательного header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          description: CMDBuild session отсутствует или истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cmdbuild/custom-api/labels/resolve:
    post:
      tags: [labels]
      x-aa-flow-id: OAPI0
      summary: Преобразовать черновики устройств в строки печатных этикеток
      description: >
        Требует same-origin Origin или Referer, CMDBuild session cookie и
        X-CMDB2Label-CSRF. Backend обогащает недостающие поля через CMDBuild REST.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Все устройства обработаны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          description: Невалидное тело запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: CMDBuild session отсутствует или истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Проверка same-origin, CSRF или прав не пройдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Тело запроса или batch устройств слишком большой
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Content-Type должен быть application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Запрос принят, но одна или несколько строк не были полностью обработаны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "502":
          description: CMDBuild upstream временно недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cmdbuild/custom-api/labels/logging/status:
    get:
      tags: [diagnostics]
      x-aa-flow-id: OAPI0
      summary: Прочитать безопасную конфигурацию логирования
      responses:
        "200":
          description: Безопасный logging status без секретов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggingStatusResponse"
        "401":
          description: CMDBuild session отсутствует или истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cmdbuild/custom-api/labels/client-log:
    get:
      tags: [diagnostics]
      x-aa-flow-id: OAPI0
      summary: Записать очищенное клиентское диагностическое событие
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
            pattern: '^[^\r\n<>]{0,80}$'
        - name: message
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
            pattern: '^[^\r\n<>]{0,160}$'
      responses:
        "200":
          description: Событие принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: CMDBuild session отсутствует или истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cmdbuild/custom-api/labels/health/live:
    get:
      tags: [health]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: H0
      summary: Liveness probe с API prefix
      description: >
        Operational endpoint без CMDBuild cookie. Не возвращает business data,
        cookies или secrets; публикуется только через protected/internal route.
      responses:
        "200":
          description: Процесс backend работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /cmdbuild/custom-api/labels/health/ready:
    get:
      tags: [health]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: H0
      summary: Readiness probe с API prefix
      description: >
        Operational endpoint без CMDBuild cookie. Не возвращает business data,
        cookies или secrets; публикуется только через protected/internal route.
      responses:
        "200":
          description: Backend готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend не готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
  /cmdbuild/custom-api/labels/about:
    get:
      tags: [health]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: H0
      summary: Безопасная build identity под API prefix
      description: >
        Operational endpoint без CMDBuild cookie. Возвращает только safe build
        identity без CMDBuild origin, cookies, secrets или payload.
      responses:
        "200":
          description: Безопасная identity сервиса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutResponse"
  /health/live:
    get:
      tags: [health]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: H0
      summary: Проверка liveness
      description: >
        Operational endpoint без CMDBuild cookie. Не возвращает business data,
        cookies или secrets; предназначен для Docker/LB/monitoring.
      responses:
        "200":
          description: Процесс backend работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /health/ready:
    get:
      tags: [health]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: H0
      summary: Проверка readiness
      description: >
        Operational endpoint без CMDBuild cookie. Не возвращает business data,
        cookies или secrets; предназначен для Docker/LB/monitoring.
      responses:
        "200":
          description: Backend готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend не готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
  /about:
    get:
      tags: [health]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: H0
      summary: Безопасная build identity
      description: >
        Operational endpoint без CMDBuild cookie. Возвращает только safe build
        identity без CMDBuild origin, cookies, secrets или payload.
      responses:
        "200":
          description: Безопасная identity сервиса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutResponse"
  /metrics:
    get:
      tags: [metrics]
      security: []
      x-aspm-risk-accepted: true
      x-aa-flow-id: M0
      summary: Метрики Prometheus
      description: >
        Operational endpoint без CMDBuild cookie. Должен публиковаться только
        для internal/protected monitoring и не содержит business data, cookies
        или secrets.
      responses:
        "200":
          description: Текстовый формат Prometheus
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
                maxLength: 65536
                pattern: '^[\s\S]*$'
components:
  securitySchemes:
    cmdbuildCookie:
      type: apiKey
      in: cookie
      name: CMDBuild-Authorization
  parameters:
    CsrfHeader:
      name: X-CMDB2Label-CSRF
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: '^[0-9a-f]{64}$'
  responses:
    BadRequest:
      description: Невалидное тело запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: CMDBuild session отсутствует или истекла
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Проверка same-origin, CSRF или прав не пройдена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Тело запроса или batch устройств слишком большой
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Content-Type должен быть application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: CMDBuild upstream временно недоступен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          example: false
        message:
          type: string
          maxLength: 512
          pattern: '^[^\r\n<>]{0,512}$'
    SessionResponse:
      type: object
      required: [ok, session]
      properties:
        ok:
          type: boolean
        session:
          type: object
          additionalProperties: true
          description: Очищенный объект CMDBuild session.
    CsrfResponse:
      type: object
      required: [ok, token, header]
      properties:
        ok:
          type: boolean
        token:
          type: string
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        header:
          type: string
          maxLength: 32
          pattern: '^X-CMDB2Label-CSRF$'
          example: X-CMDB2Label-CSRF
    ResolveRequest:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DeviceDraft"
    DeviceDraft:
      type: object
      properties:
        inv:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
          description: Инвентарный номер.
        type:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
          description: Тип устройства, печатаемый на этикетке.
        model:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
          description: Модель устройства.
        sn:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
          description: Серийный номер.
        lookupKey:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
          description: Внутренний lookup key из одноколоночного CSV; напрямую не печатается.
      additionalProperties: true
    LabelDevice:
      type: object
      required: [inv, type, model, sn]
      properties:
        inv:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
        type:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
        model:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
        sn:
          type: string
          maxLength: 256
          pattern: '^[^\r\n<>]{0,256}$'
    ResolveResponse:
      type: object
      required: [ok, devices, errors, meta]
      properties:
        ok:
          type: boolean
        devices:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/LabelDevice"
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          required: [inputCount, outputCount, cmdbuildRestCalls]
          properties:
            inputCount:
              type: integer
            outputCount:
              type: integer
            cmdbuildRestCalls:
              type: integer
    BuildIdentity:
      type: object
      required: [version, buildVersion, revision, sourceState, buildMode, runtimeArtifact]
      properties:
        version:
          type: string
          maxLength: 16
          pattern: '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'
        buildVersion:
          type: string
          maxLength: 16
          pattern: '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'
        revision:
          type: string
          maxLength: 40
          pattern: '^(unknown|[0-9a-f]{40})$'
        sourceState:
          type: string
          enum: [verified, unverified-local]
        buildMode:
          type: string
          enum: [canonical, manual]
        runtimeArtifact:
          type: object
          additionalProperties: true
    LiveHealth:
      type: object
      required: [service, live, identity]
      properties:
        service:
          type: string
          maxLength: 16
          pattern: '^cmdb2label$'
          example: cmdb2label
        live:
          type: boolean
        identity:
          $ref: "#/components/schemas/BuildIdentity"
    ReadyHealth:
      type: object
      required: [service, ready]
      properties:
        service:
          type: string
          maxLength: 16
          pattern: '^cmdb2label$'
          example: cmdb2label
        ready:
          type: boolean
        status:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9 _.-]{0,64}$'
        identity:
          $ref: "#/components/schemas/BuildIdentity"
    AboutResponse:
      type: object
      required: [service, identity]
      properties:
        service:
          type: string
          maxLength: 16
          pattern: '^cmdb2label$'
          example: cmdb2label
        identity:
          $ref: "#/components/schemas/BuildIdentity"
    LoggingStatusResponse:
      type: object
      required: [ok, logging]
      properties:
        ok:
          type: boolean
        logging:
          type: object
          additionalProperties: true
