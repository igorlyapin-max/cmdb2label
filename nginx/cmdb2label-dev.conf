limit_req_zone $binary_remote_addr zone=cmdb2label_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cmdb2label_ui:10m rate=20r/s;
limit_req_status 429;

server {
  listen 8095 default_server;
  server_name localhost 127.0.0.1;

  client_max_body_size 10m;

  # ASPM: $host используется только для allowlist+reject на dev-only listener.
  # Downstream Host/X-Forwarded-Host ниже заданы статически и не берутся из запроса.
  if ($host !~ ^(localhost|127\.0\.0\.1)(:8095)?$) {
    return 444;
  }

  location /cmdbuild/custom-api/labels/ {
    limit_req zone=cmdb2label_api burst=30 nodelay;

    proxy_pass http://127.0.0.1:8094/cmdbuild/custom-api/labels/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host localhost:8095;
    proxy_set_header X-Forwarded-Host localhost:8095;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /cmdbuild/labels/ {
    limit_req zone=cmdb2label_ui burst=60 nodelay;

    proxy_pass http://127.0.0.1:8094/cmdbuild/labels/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host localhost:8095;
    proxy_set_header X-Forwarded-Host localhost:8095;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health/ {
    proxy_pass http://127.0.0.1:8094/health/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host localhost:8095;
    proxy_set_header X-Forwarded-Host localhost:8095;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

}
